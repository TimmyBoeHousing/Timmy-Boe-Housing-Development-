<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
    }
    header {
      background: #333;
      color: #fff;
      padding: 1rem 0;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #555;
    }
    nav a {
      color: #fff;
      padding: 14px 20px;
      text-decoration: none;
    }
    nav a:hover {
      background: #777;
    }
    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
      background: #fff;
    }
    footer {
      text-align: center;
      padding: 10px;
      background: #333;
      color: #fff;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
  <p>Your tagline here</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#about">About</a>
  <a href="#contact">Contact</a>
</nav>

<div class="container">
  <section id="home">
    <h2>Home</h2>
    <p>This is a simple website you can upload to GitHub Pages.</p>
  </section>

  <section id="about">
    <h2>About</h2>
    <p>Write something about yourself here.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: your@email.com</p>
  </section>
</div>

<footer>
  <p>© 2026 My Website</p>
</footer>

</body>
</html>
